<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cavalry Web Player – Creative Southwest</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #viewport {
        position: relative;
        background: transparent;
      }

      canvas {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: block;
      }
    </style>
  </head>

  <body>
    <div id="viewport">
      <canvas id="canvas"></canvas>
    </div>

    <script>
      // Classic script, not type="module": a live hard-refresh repro + `sample` on the
      // hung WebContent process showed the hang is WebKit's own module-loader recursing
      // on itself while evaluating a module script (moduleLoaderEvaluate calling back
      // into itself via MicrotaskQueue::enqueue, no fetch/network frames involved) -
      // and it reproduced identically even after importing CavalryWasm.js from a
      // guaranteed-unique Blob URL, which rules out the *dynamically imported* module
      // as the trigger. That leaves this script itself: as a `type="module"` script it
      // participates in the same module registry/evaluation pipeline, so a hard refresh
      // may be re-entering evaluation of a stale record for *this* script. Dynamic
      // `import()` doesn't require its calling script to be a module, so dropping
      // `type="module"` removes this script from that pipeline entirely; the async IIFE
      // below replaces the top-level `await` that module scripts allow but classic
      // scripts don't.
      const log = (...args) => console.log("[CWP]", ...args)

      const canvas = document.getElementById("canvas")
      const viewport = document.getElementById("viewport")

      let SCENE_WIDTH = 1080
      let SCENE_HEIGHT = 1920

      let Module
      let app
      let surface
      let animationFrameId = 0
      let playbackLoopRunning = false

      let speakerName = ""
      let talkTitle = ""
      let isRendering = false

      function slugifyForFilename(value) {
        return value
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
      }

      function postToParent(message) {
        window.parent.postMessage(message, "*")
      }

      // Renders a visible retry state instead of leaving the page permanently blank -
      // e.g. if a fetch stalls on a flaky mobile connection, or WASM instantiation hangs.
      function showBootError(message) {
        postToParent({ type: "player-error", message })
        document.body.innerHTML = `
          <div style="padding:16px;font-family:system-ui;color:#c00;text-align:center">
            <strong>${message}</strong><br/>
            <button id="cwp-retry" style="margin-top:8px;padding:6px 14px;">Retry</button>
          </div>
        `
        document.getElementById("cwp-retry").addEventListener("click", () => location.reload())
      }

      // Boot = module import through the player-ready postMessage below. If that chain
      // hasn't completed within BOOT_TIMEOUT_MS (e.g. a stalled fetch, or WASM
      // instantiation hanging), surface a retry UI instead of an indefinitely blank canvas.
      // Generous on purpose: the WASM binary alone is ~12MB, and a slow mobile connection
      // downloading that is a legitimate slow load, not a hang, so this should only fire
      // for genuine stalls (a dropped connection, a promise that never resolves).
      const BOOT_TIMEOUT_MS = 45000
      let bootComplete = false
      const bootWatchdog = setTimeout(() => {
        console.error("[CWP] Boot timed out after", BOOT_TIMEOUT_MS, "ms")
        showBootError("Cavalry Web Player is taking longer than expected to load.")
      }, BOOT_TIMEOUT_MS)

      // CavalryModule.default()'s internal asset-package loader (see CavalryWasm.js)
      // fetches CavalryWasm.data via a fire-and-forget async IIFE that isn't awaited
      // by, or chained into, the promise this script awaits - so a fetch failure
      // there (a dropped mobile connection, mid-download) never reaches the try/catch
      // below. It only surfaces as an unhandled rejection, which otherwise left boot
      // hanging silently until the full BOOT_TIMEOUT_MS watchdog above. Catch it here
      // to fail fast instead.
      window.addEventListener("unhandledrejection", (event) => {
        if (bootComplete) return
        console.error("[CWP] Unhandled rejection during boot", event.reason)
        clearTimeout(bootWatchdog)
        showBootError("Cavalry Web Player failed to start.")
      })
      window.addEventListener("error", (event) => {
        if (bootComplete) return
        console.error("[CWP] Uncaught error during boot", event.error || event.message)
        clearTimeout(bootWatchdog)
        showBootError("Cavalry Web Player failed to start.")
      })

      function emitFrameUpdate() {
        if (!app) return
        postToParent({
          type: "frame-update",
          currentFrame: app.getFrame(),
          startFrame: app.getStartFrame(),
          endFrame: app.getEndFrame(),
          isPlaying: app.isPlaying(),
        })
      }

      async function writeFile(module, path) {
        const response = await fetch(path)
        if (!response.ok) {
          throw new Error(`Failed to fetch ${path}: ${response.status} ${response.statusText}`)
        }
        const filename = path.split("/").pop()
        const asset = await response.arrayBuffer()
        module.FS.writeFile(filename, new Uint8Array(asset))
        return filename
      }

      function resizeViewportAndSurface() {
        if (!Module) return

        const winW = window.innerWidth
        const winH = window.innerHeight

        const compAspect = SCENE_WIDTH / SCENE_HEIGHT

        let renderW, renderH

        if (compAspect >= 1) {
          renderW = winW
          renderH = Math.round(winW / compAspect)
          if (renderH > winH) {
            renderH = winH
            renderW = Math.round(winH * compAspect)
          }
        } else {
          renderH = winH
          renderW = Math.round(winH * compAspect)
          if (renderW > winW) {
            renderW = winW
            renderH = Math.round(winW / compAspect)
          }
        }

        viewport.style.width = renderW + "px"
        viewport.style.height = renderH + "px"

        const dpr = window.devicePixelRatio || 1

        canvas.width = renderW * dpr
        canvas.height = renderH * dpr
        canvas.style.width = renderW + "px"
        canvas.style.height = renderH + "px"

        surface = Module.makeWebGLSurfaceFromElement(canvas, renderW * dpr, renderH * dpr)

        if (app && surface) {
          app.render(surface)
        }
      }

      function runPlaybackLoop() {
        if (!app || !surface) return
        if (playbackLoopRunning) return

        playbackLoopRunning = true

        function tick(time) {
          if (!app || !surface || !app.isPlaying()) {
            playbackLoopRunning = false
            animationFrameId = 0
            emitFrameUpdate()
            return
          }

          const status = app.tick(surface, time)

          if (status.frameChanged) {
            postToParent({
              type: "frame-update",
              currentFrame: status.currentFrame,
              startFrame: app.getStartFrame(),
              endFrame: app.getEndFrame(),
              isPlaying: true,
              fps: status.actualFPS,
            })
          }

          animationFrameId = requestAnimationFrame(tick)
        }

        animationFrameId = requestAnimationFrame(tick)
      }

      function stopPlaybackLoop() {
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId)
        }
        animationFrameId = 0
        playbackLoopRunning = false
      }

      // CavalryWasm.js's generated loader fetches the ~12MB .wasm and ~500KB .data
      // with no explicit cache mode (see the fetch() and instantiateStreaming() call
      // sites there). Browsers - Safari especially has a documented history of this -
      // can end up serving a stale or partially-written disk-cache entry for a large
      // streamed response, particularly if an earlier load was interrupted (a fast
      // reload, a cancelled navigation). `cache: "reload"` forces every request for
      // our own large/critical assets to bypass any cached response and revalidate
      // from the network, without disabling caching entirely (unlike "no-store", a
      // fresh response is still stored for the *next* load). Scoped to same-origin
      // matching URLs so it doesn't force needless revalidation of third-party
      // resources (e.g. ffmpeg's core, loaded from unpkg for renderMp4).
      const originalFetch = window.fetch.bind(window)
      window.fetch = (input, init) => {
        const url = typeof input === "string" ? input : input?.url || ""
        let sameOrigin = false
        try {
          sameOrigin = new URL(url, location.href).origin === location.origin
        } catch {}
        if (sameOrigin && /\.(wasm|data|cv|ttf)(\?|$)/.test(url)) {
          return originalFetch(input, { ...init, cache: "reload" })
        }
        return originalFetch(input, init)
      }

      ;(async () => {
      try {
        log("Importing CavalryWasm.js")
        const CavalryModule = await import("/CavalryWasm.js")

        log("Initialising module")
        Module = await CavalryModule.default({
          canvas,
          locateFile: (path) => `/wasm-lib/${path}`,
        })

        const loadedAssets = new Set()
        // The parent page can fire cavalryAutoLoadAsset before `app` exists below (it
        // doesn't wait for a ready signal). Queue those events instead of letting them
        // throw into an unhandled rejection, and drain the queue once app is created.
        const pendingAssetEvents = []

        async function handleAutoLoadAsset(event) {
          const { type, assetId, filename } = event.detail
          const key = `${assetId}:${filename}`
          if (loadedAssets.has(key)) {
            log("Skipping already-loaded asset:", filename)
            return
          }
          loadedAssets.add(key)

          try {
            if (type === "font") {
              log("Auto-loading font:", filename)
              const response = await fetch("/" + filename)
              if (!response.ok) throw new Error(`Failed to fetch font: ${filename}`)
              const data = await response.arrayBuffer()
              Module.FS.writeFile(filename, new Uint8Array(data))
              app.replaceFontAsset(filename, assetId)
              if (surface) app.render(surface)
              log("Font loaded:", filename)
            }

            if (type === "image") {
              log("Auto-loading image:", filename)
              const response = await fetch("/" + filename)
              if (!response.ok) throw new Error(`Failed to fetch image: ${filename}`)
              const data = await response.arrayBuffer()
              Module.FS.writeFile(filename, new Uint8Array(data))
              app.replaceImageAsset(filename, assetId)
              if (surface) app.render(surface)
              log("Image loaded:", filename)
            }
          } catch (err) {
            console.error("[CWP] Failed to auto-load asset", filename, err)
          }
        }

        window.addEventListener("cavalryAutoLoadAsset", (event) => {
          if (!app) {
            log("Queueing asset event received before app was ready:", event.detail?.filename)
            pendingAssetEvents.push(event)
            return
          }
          handleAutoLoadAsset(event)
        })

        log("Loading scene: Spot_CSW_Case_Study_v002.cv")
        const sceneFile = await writeFile(Module, "/scenes/Spot_CSW_Case_Study_v002.cv")

        log("Creating app")
        app = Module.Cavalry.MakeWithPath(sceneFile)

        if (pendingAssetEvents.length) {
          log(`Processing ${pendingAssetEvents.length} queued asset event(s)`)
          for (const event of pendingAssetEvents.splice(0)) {
            handleAutoLoadAsset(event)
          }
        }

        const res = app.getSceneResolution()
        if (res && res.width > 0 && res.height > 0) {
          SCENE_WIDTH = res.width
          SCENE_HEIGHT = res.height
          log("Scene resolution:", SCENE_WIDTH, "x", SCENE_HEIGHT)
        }

        // Seed the export filename fields from the scene's own defaults, in case
        // Framer never sends a set-attribute for one (e.g. left at its placeholder).
        speakerName = String(app.getAttribute("string#12", "string") ?? "")
        talkTitle = String(app.getAttribute("string#14", "string") ?? "")

        resizeViewportAndSurface()

        // A native `resize` event only fires for actual window-size changes. When this
        // player is embedded as a cross-origin iframe (e.g. in Framer), the parent page
        // can resize the iframe element itself via CSS/layout after this script's first
        // paint - Safari in particular doesn't reliably propagate that into a `resize`
        // event on the iframe's own window, which left the canvas locked to a stale,
        // often too-small size. ResizeObserver fires on any content-box size change of
        // the observed element regardless of cause, so it catches that case too.
        const resizeObserver = new ResizeObserver(() => resizeViewportAndSurface())
        resizeObserver.observe(document.documentElement)

        // Start paused on frame 0
        app.setFrame(0)
        app.setLoop(true)
        if (surface) app.render(surface)

        // Notify parent that the player is ready
        postToParent({
          type: "player-ready",
          startFrame: app.getStartFrame(),
          endFrame: app.getEndFrame(),
          fps: app.getFPS(),
          resolution: { width: SCENE_WIDTH, height: SCENE_HEIGHT },
          isPlaying: false,
        })

        bootComplete = true
        clearTimeout(bootWatchdog)

        function loadScript(src) {
          return new Promise((resolve, reject) => {
            const script = document.createElement("script")
            script.src = src
            script.onload = resolve
            script.onerror = reject
            document.head.appendChild(script)
          })
        }

        async function ensureFFmpegLoaded() {
          if (typeof FFmpegWASM !== "undefined") return
          log("renderMp4: fetching FFmpeg.wasm...")
          // Self-hosted rather than pulled from a CDN: the FFmpeg worker script needs to
          // be same-origin (browsers refuse to construct a Worker from a cross-origin
          // script URL), and self-hosting also avoids depending on unpkg's uptime.
          await loadScript("/ffmpeg/ffmpeg.js")
          log("renderMp4: FFmpeg.wasm ready")
        }

        async function renderSceneToMp4(startFrame, endFrame) {
          if (typeof startFrame !== "number") startFrame = app.getStartFrame()
          if (typeof endFrame !== "number") endFrame = app.getEndFrame()

          log(`renderMp4: startFrame=${startFrame}, endFrame=${endFrame}`)

          await ensureFFmpegLoaded()

          if (typeof FFmpegWASM === "undefined") {
            console.error("[CWP] FFmpegWASM is not defined. Make sure ffmpeg.js is loaded.")
            return
          }

          const sceneStartFrame = app.getStartFrame()
          const sceneEndFrame = app.getEndFrame()

          if (
            startFrame < sceneStartFrame || startFrame > sceneEndFrame ||
            endFrame < sceneStartFrame || endFrame > sceneEndFrame ||
            endFrame <= startFrame
          ) {
            throw new Error(
              `[renderMp4] Invalid frame range: startFrame=${startFrame}, endFrame=${endFrame}, scene=[${sceneStartFrame}, ${sceneEndFrame}]`
            )
          }

          const { FFmpeg } = FFmpegWASM
          const fps = app.getFPS()
          const ffmpeg = new FFmpeg()
          ffmpeg.on("log", ({ message }) => log("[ffmpeg]", message))
          ffmpeg.on("progress", ({ progress }) => {
            const clamped = Math.min(Math.max(progress, 0), 1)
            const percent = Math.round(clamped * 100)
            postToParent({ type: "render-progress", phase: "encode", percent })

            // Purely a visual aid - scrub the on-screen preview across the frame range
            // in step with encode progress, so it looks like the sequence is playing
            // through a second time while ffmpeg works, rather than sitting frozen.
            // Doesn't need to (and doesn't) correspond to the actual frame ffmpeg is
            // encoding at that moment.
            if (surface) {
              const previewFrame = Math.round(startFrame + (endFrame - startFrame) * clamped)
              app.setFrame(previewFrame)
              app.render(surface)
              emitFrameUpdate()
            }
          })

          // Kick off loading the core now, in parallel with frame capture below, instead
          // of waiting until capture finishes to start it. Loading runs in ffmpeg's own
          // worker thread, so it overlaps with the main-thread capture work below - not
          // a full hide in practice (likely CPU contention between the two), but it
          // measurably cuts the load time that shows up after capture finishes.
          //
          // The core itself (ffmpeg-core.wasm, ~30MB) exceeds Cloudflare Pages' 25MB
          // per-file limit, so it's loaded from unpkg instead. That's fine: unlike
          // ffmpeg.js's worker (which must be same-origin, hence self-hosted separately),
          // the worker fetches these via CORS, and unpkg sends ACAO: *.
          const coreBaseURL = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd"
          const ffmpegLoadPromise = ffmpeg.load({
            coreURL: `${coreBaseURL}/ffmpeg-core.js`,
            wasmURL: `${coreBaseURL}/ffmpeg-core.wasm`,
          })

          const res = app.getSceneResolution()
          // Capture at 2x the scene's native resolution, then downscale to native for
          // delivery (see the ffmpeg -vf scale filter below). This is genuine
          // supersampling - sharper anti-aliased edges in the delivered 1x video - not
          // just a bigger intermediate. Confirmed via profiling that captured PNGs
          // already contain any softness even at lossless encoding, so the fix has to
          // happen upstream of ffmpeg, not in its settings.
          const outputWidth = res.width
          const outputHeight = res.height
          const width = res.width * 2
          const height = res.height * 2
          const frames = []

          const offscreen = document.createElement("canvas")
          offscreen.width = width
          offscreen.height = height
          const ctx = offscreen.getContext("2d")

          if (!ctx) {
            console.error("[CWP] renderMp4: failed to create 2D canvas context.")
            return
          }

          // Temporarily resize the existing on-screen canvas/surface to the capture
          // resolution, instead of the viewport-fit size it normally runs at (which
          // would otherwise produce upscaled, blurry frames). A second, simultaneous
          // WebGL context was tried here first but reliably triggered CONTEXT_LOST_WEBGL,
          // so we reuse the single existing context instead.
          canvas.width = width
          canvas.height = height
          surface = Module.makeWebGLSurfaceFromElement(canvas, width, height)

          app.stop()
          stopPlaybackLoop()

          // makeWebGLSurfaceFromElement just above hands back a brand-new surface, and
          // its first few render() calls don't actually reach the canvas yet - confirmed
          // by screenshotting each captured frame during a live Chrome export: frames 0-2
          // came back solid white (no draw at all) while later frames were correct, and
          // the very first canvas.toBlob() call (whichever frame it lands on) absorbed a
          // multi-second stall, consistent with deferred GPU work (shader compiles,
          // texture uploads) only actually flushing once something forces a readback.
          // A handful of cheap throwaway renders here forces that flush up front instead
          // of on a real captured frame, fixing both the dropped-elements-on-export bug
          // and the one-time stall (measured: ~9s stall on frame 0 down to a normal ~30ms
          // once primed here).
          app.setFrame(startFrame)
          for (let priming = 0; priming < 5; priming++) {
            app.render(surface)
          }

          log("renderMp4: capturing frames...")

          const totalFrames = endFrame - startFrame + 1
          let lastCapturePercent = -1

          for (let i = startFrame; i <= endFrame; i++) {
            app.setFrame(i)
            app.render(surface)
            emitFrameUpdate()
            ctx.drawImage(canvas, 0, 0, width, height)

            const blob = await new Promise(resolve => offscreen.toBlob(resolve, "image/png"))
            const buffer = new Uint8Array(await blob.arrayBuffer())
            const relativeFrame = i - startFrame
            frames.push({ name: `frame_${String(relativeFrame).padStart(4, "0")}.png`, data: buffer })

            const capturePercent = Math.round(((relativeFrame + 1) / totalFrames) * 100)
            if (capturePercent !== lastCapturePercent) {
              lastCapturePercent = capturePercent
              postToParent({ type: "render-progress", phase: "capture", percent: capturePercent })
            }
          }

          resizeViewportAndSurface()
          emitFrameUpdate()

          log("renderMp4: initializing FFmpeg...")
          await ffmpegLoadPromise

          for (const frame of frames) {
            await ffmpeg.writeFile(frame.name, frame.data)
          }

          log("renderMp4: encoding...")
          await ffmpeg.exec([
            "-framerate", String(fps),
            "-i", "frame_%04d.png",
            "-vf", `scale=${outputWidth}:${outputHeight}`,
            "-c:v", "libx264",
            "-preset", "veryfast",
            "-crf", "10",
            "-pix_fmt", "yuv420p",
            "output.mp4"
          ])

          const out = await ffmpeg.readFile("output.mp4")
          const url = URL.createObjectURL(new Blob([out.buffer], { type: "video/mp4" }))

          const filenameParts = [slugifyForFilename(speakerName), slugifyForFilename(talkTitle)].filter(Boolean)
          const filename = filenameParts.length ? `${filenameParts.join("_")}.mp4` : "cavalry-recording.mp4"

          const a = document.createElement("a")
          a.href = url
          a.download = filename
          log("renderMp4: downloading...", filename)
          a.click()

          postToParent({ type: "render-complete", filename })
        }

        log("Registering message listener")

        window.addEventListener("message", (event) => {
          const data = event.data
          if (!data || typeof data !== "object") return

          if (data.type === "player-control") {
            try {
              switch (data.action) {
                case "play":
                  app.play()
                  runPlaybackLoop()
                  break

                case "pause":
                  app.stop()
                  stopPlaybackLoop()
                  if (surface) app.render(surface)
                  emitFrameUpdate()
                  break

                case "toggle":
                  if (app.isPlaying()) {
                    app.stop()
                    stopPlaybackLoop()
                    if (surface) app.render(surface)
                  } else {
                    app.play()
                    runPlaybackLoop()
                  }
                  emitFrameUpdate()
                  break

                case "setFrame": {
                  const frame = data.frame
                  if (typeof frame === "number") {
                    app.stop()
                    stopPlaybackLoop()
                    app.setFrame(frame)
                    if (surface) app.render(surface)
                    emitFrameUpdate()
                  }
                  break
                }

                case "setLoop":
                  if (typeof data.loop === "boolean") {
                    app.setLoop(data.loop)
                  }
                  break

                case "setPlaybackMode":
                  if (typeof data.mode === "number") {
                    app.setPlaybackMode(data.mode)
                  }
                  break

                case "setCompTimeMultiplier":
                  if (typeof data.multiplier === "number") {
                    app.setCompTimeMultiplier(data.multiplier)
                  }
                  break

                case "getState":
                  postToParent({
                    type: "player-ready",
                    startFrame: app.getStartFrame(),
                    endFrame: app.getEndFrame(),
                    fps: app.getFPS(),
                    resolution: { width: SCENE_WIDTH, height: SCENE_HEIGHT },
                    isPlaying: app.isPlaying(),
                  })
                  emitFrameUpdate()
                  break

                case "renderMp4": {
                  if (isRendering) {
                    log("renderMp4: ignoring request, a render is already in progress")
                    break
                  }
                  const { startFrame, endFrame } = data
                  isRendering = true
                  postToParent({ type: "render-start" })
                  renderSceneToMp4(startFrame, endFrame)
                    .catch(err => {
                      console.error("[CWP] renderMp4 failed", err)
                      postToParent({ type: "render-error", message: err.message })
                    })
                    .finally(() => {
                      isRendering = false
                    })
                  break
                }
              }
            } catch (err) {
              console.error("[CWP] player-control failed", err)
            }
            return
          }

          if (data.type === "set-attribute") {
            const { path, value } = data
            if (typeof path !== "string" || !path.includes(".")) return

            try {
              const nodeId = path.slice(0, path.indexOf("."))
              const attr = path.slice(path.indexOf(".") + 1)

              app.setAttribute(nodeId, attr, value)

              if (path === "string#12.string") {
                speakerName = String(value)
              }

              if (path === "string#14.string") {
                talkTitle = String(value)
              }

              if (path === "compNode#1.resolution") {
                const [w, h] = value
                if (w > 0 && h > 0) {
                  SCENE_WIDTH = w
                  SCENE_HEIGHT = h
                  log("Resolution updated:", w, "x", h)
                  resizeViewportAndSurface()
                }
              }

              if (surface) app.render(surface)
            } catch (err) {
              console.error("[CWP] setAttribute failed", err)
            }
            return
          }
        })

        log("Running ✓")
      } catch (err) {
        bootComplete = true
        clearTimeout(bootWatchdog)
        console.error("[CWP] Fatal error", err)
        showBootError("Cavalry Web Player failed to start.")
      }
      })()
    </script>
  </body>
</html>

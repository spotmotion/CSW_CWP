<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CWP test harness</title>
  </head>
  <body style="margin: 0">
    <!--
      Starts intentionally undersized (or at ?w=&h= if given) to stand in for a
      Framer embed that hasn't finished sizing the iframe by the time the player
      boots. resizeIframe() below then simulates the parent's layout settling
      later, at whatever point the caller chooses.
    -->
    <iframe id="player" name="player" src="/index.html" style="border: none; display: block"></iframe>
    <script>
      window.__messages = []
      window.addEventListener("message", (event) => {
        if (event.data && typeof event.data === "object") {
          window.__messages.push(event.data)
        }
      })

      window.resizeIframe = (width, height) => {
        const iframe = document.getElementById("player")
        iframe.style.width = width + "px"
        iframe.style.height = height + "px"
      }

      const params = new URLSearchParams(location.search)
      window.resizeIframe(Number(params.get("w")) || 200, Number(params.get("h")) || 200)
    </script>
  </body>
</html>
